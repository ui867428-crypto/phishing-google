<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signing in...</title>
<style>
  body { font-family: 'Google Sans', Roboto, Arial, sans-serif;
         display: flex; justify-content: center; align-items: center;
         min-height: 100vh; margin: 0; background: #fff;
         flex-direction: column; }
  .spinner { width: 40px; height: 40px;
    border: 4px solid #e0e0e0; border-top-color: #1a73e8;
    border-radius: 50%; animation: spin 0.8s linear infinite;
    margin-bottom: 24px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .text { font-size: 16px; color: #5f6368; }
</style>
</head>
<body>
  <div class="spinner"></div>
  <div class="text">Signing in...</div>
<script>
  setTimeout(() => { window.location.href = 'https://myaccount.google.com/'; }, 2000);
</script>
</body>
</html>
